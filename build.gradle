plugins {
    // Core JVM build — no Android, no application plugin needed yet
    id 'java'
    id 'application'
}

group = 'com.debyte'
version = '0.1.0'

// Java 17 LTS — matches the JDK installed on this machine
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // TUI framework (JLine 3 — terminal input, line editing, ANSI rendering)
    implementation 'org.jline:jline:3.30.0'

    // JSON persistence for the file-index database
    implementation 'com.google.code.gson:gson:2.13.2'

    // Testing
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    // Entry point class (created later when we start coding)
    mainClass = 'solite.Main'
}

test {
    useJUnitPlatform()
}

// Standalone runnable jar — `java -jar build/libs/solite-0.1.0-all.jar`
// This is what the `solite` launcher on PATH uses (same idea as opencode /
// antigravity: one command, no gradle in the loop).
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Build a self-contained runnable jar for the `solite` CLI.'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'solite.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

// `./gradlew installCli` copies the fat jar next to the launcher scripts.
tasks.register('installCli', Copy) {
    group = 'build'
    description = 'Build the fat jar and refresh the local CLI install dir.'
    dependsOn 'fatJar'
    from layout.buildDirectory.file("libs/solite-${version}-all.jar")
    into "${rootDir}/cli"
    rename { 'solite.jar' }
}

